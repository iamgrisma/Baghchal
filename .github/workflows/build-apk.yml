name: Build Android APK & Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Assemble Android APK & Play Store AAB Bundle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Prepare Output Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Baghchal-v1.1.4.apk
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-output/Baghchal-v1.1.4.aab
          elif [ -f "android/app/build/outputs/bundle/debug/app-debug.aab" ]; then
            cp android/app/build/outputs/bundle/debug/app-debug.aab build-output/Baghchal-v1.1.4.aab
          fi
          ls -la build-output/

      - name: Upload Artifacts (APK & Play Store AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Baghchal-Android-Builds
          path: build-output/*
          retention-days: 30
